<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Uninet</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png')}}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Detalle del programa aceptado en Uninet." />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/info_programa_respuestas.css')}}">
        <script defer type="text/javascript" src="{{ url_for('static', filename='js/info_programa_respuestas.js')}}"></script>
    </head>

    <body>

        <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <aside class="sidebar" id="sidebar">
            <button class="sidebar__close" onclick="toggleSidebar()" aria-label="Cerrar menú">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <div class="sidebar__brand">Uninet</div>
            <div class="sidebar__role">Cuenta de estudiante</div>
            <nav class="sidebar__nav">
                <a href="/perfilalu" class="navlink">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                    Perfil
                </a>
                <a href="/homealu" class="navlink">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
                    Home
                </a>
                <a href="/enviadas" class="navlink">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    Enviadas
                </a>
                <a href="/respuestasalu" class="navlink is-active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    Respuestas
                </a>
            </nav>
            <div class="sidebar__footer">Universidades y estudiantes, en la misma red.</div>
        </aside>

        <main class="main">
            <div class="content">
                <a href="/respuestasalu" class="back-link">← Volver a respuestas</a>

                <div class="detail-header">
                    <h1 class="detail-title">{{programas[1]}} - {{programas[9]}}</h1>
                    <div class="pill-row">
                        <span class="pill">{{programas[6]}}</span>
                        <span class="pill">{{programas[10]}}</span>
                        <span class="pill pill--price">{{programas[3]}}$</span>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section__title">Descripción</h3>
                    <p class="section__body">{{programas[8]}}</p>
                </div>

                <div class="section">
                    <h3 class="section__title">Requisitos</h3>
                    <p class="section__body">{{programas[4]}}</p>
                </div>

                <div class="actions">
                    <a href="/respuestasalu" class="btn-ghost">Volver</a>
                </div>
            </div>
        </main>

    </body>
</html>
